services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urlshortner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshortner-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    restart: unless-stopped
