services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: urlshortner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urlshortner-backend
    expose:
      - "50:50"
    env_file:
      - ./backend/.env.prod
    restart: unless-stopped